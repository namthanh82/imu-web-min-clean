name: Build and Release ReTrack

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev dpkg-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app
        run: |
          pyinstaller --noconfirm --clean ReTrack.spec

      - name: Package .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="0.0.0"; fi
          chmod +x dist/ReTrack
          mkdir -p package/DEBIAN package/opt/retrack package/usr/local/bin package/usr/share/applications
          cp dist/ReTrack package/opt/retrack/ReTrack
          ln -s /opt/retrack/ReTrack package/usr/local/bin/retrack
          cat > package/DEBIAN/control <<EOF
          Package: retrack
          Version: ${VERSION}
          Section: science
          Priority: optional
          Architecture: arm64
          Maintainer: BIOTRACKERS <support@example.com>
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Description: ReTrack IMU rehabilitation tracking desktop app
           ReTrack records and analyzes IMU rehabilitation sessions in a desktop window.
          EOF
          sed -i 's/^          //' package/DEBIAN/control
          cat > package/usr/share/applications/retrack.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=ReTrack
          Comment=IMU rehabilitation tracking desktop app
          Exec=/opt/retrack/ReTrack
          Terminal=false
          Categories=Science;MedicalSoftware;
          EOF
          sed -i 's/^          //' package/usr/share/applications/retrack.desktop
          dpkg-deb --build package ReTrack-Linux-arm64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReTrack-Linux-arm64
          path: ReTrack-Linux-arm64.deb

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ReTrack-Linux-arm64.deb
